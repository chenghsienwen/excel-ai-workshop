name: Deploy BM Report Viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - app/bm_report_viewer/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cryptography
        run: pip install cryptography --quiet

      - name: Decrypt CSV data
        env:
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
        run: python app/bm_report_viewer/crypt_data.py --decrypt

      - name: Build static site
        run: python app/bm_report_viewer/build.py

      - name: Upload bm-viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bm-viewer-dist
          path: app/bm_report_viewer/dist/
          retention-days: 30
          overwrite: true

      - name: Download slides artifact
        run: |
          ARTIFACT_ID=$(gh api /repos/${{ github.repository }}/actions/artifacts \
            --jq '[.artifacts[] | select(.name=="slides-dist" and .expired==false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: No slides-dist artifact found. Run deploy-slides workflow first, then re-run this workflow." >&2
            exit 1
          fi
          gh api /repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > slides.zip
          mkdir -p slides-dist && unzip -q slides.zip -d slides-dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble site
        run: |
          mkdir -p _site/bm-viewer
          cp -r slides-dist/. _site/
          cp app/bm_report_viewer/dist/index.html _site/bm-viewer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
