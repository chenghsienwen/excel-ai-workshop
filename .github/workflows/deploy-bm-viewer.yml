name: Deploy BM Report Viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cryptography
        run: pip install cryptography --quiet

      - name: Decrypt CSV data
        env:
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
        run: python app/bm_report_viewer/crypt_data.py --decrypt

      - name: Build static site
        run: python app/bm_report_viewer/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/bm_report_viewer/dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
