name: Deploy Slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - slides.md
      - slides-workshop.md
      - slides-workshop-zh.md
      - components/**
      - layouts/**
      - pages/**
      - public/**
      - snippets/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cryptography
        run: pip install cryptography --quiet

      - name: Decrypt theme package
        env:
          THEME_FERNET_KEY: ${{ secrets.THEME_FERNET_KEY }}
        run: python crypt_theme.py --decrypt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main slides (RD)
        run: pnpm slidev build --base /excel-ai-workshop/

      - name: Build workshop slides (student)
        run: pnpm slidev build slides-workshop.md --base /excel-ai-workshop/workshop/ --out dist-workshop/

      - name: Build workshop slides (Traditional Chinese)
        run: pnpm slidev build slides-workshop-zh.md --base /excel-ai-workshop/workshop-zh/ --out dist-workshop-zh/

      - name: Prepare slides artifact
        run: |
          mkdir -p slides-combined/workshop slides-combined/workshop-zh
          cp -r dist/. slides-combined/
          cp -r dist-workshop/. slides-combined/workshop/
          cp -r dist-workshop-zh/. slides-combined/workshop-zh/

      - name: Upload slides artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-dist
          path: slides-combined/
          retention-days: 30
          overwrite: true

      - name: Download bm-viewer artifact
        id: bm-viewer-artifact
        run: |
          ARTIFACT_ID=$(gh api /repos/${{ github.repository }}/actions/artifacts \
            --jq '[.artifacts[] | select(.name=="bm-viewer-dist" and .expired==false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api /repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > bm-viewer.zip
            mkdir -p bm-viewer-dist && unzip -q bm-viewer.zip -d bm-viewer-dist/
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble site
        run: |
          mkdir -p _site/bm-viewer _site/workshop _site/workshop-zh
          cp -r dist/. _site/
          cp -r dist-workshop/. _site/workshop/
          cp -r dist-workshop-zh/. _site/workshop-zh/
          if [ "${{ steps.bm-viewer-artifact.outputs.found }}" = "true" ]; then
            cp bm-viewer-dist/index.html _site/bm-viewer/
          else
            echo '<meta http-equiv="refresh" content="0;url=/excel-ai-workshop/">' > _site/bm-viewer/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
